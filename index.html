<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />
    <meta
      name="description"
      content="Association Osaer – danse contemporaine, chorégraphie. Découvrez nos projets et événements."
    />

    <title>Association Osaer</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/Pics/logo2.png" />
    <link rel="apple-touch-icon" href="/Pics/logo2.png" />

    <!-- Google Fonts préchargées -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Quicksand:wght@300;400;500&display=swap"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Quicksand:wght@300;400;500&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <!-- Préchargement image LCP -->
    <link
      rel="preload"
      as="image"
      href="/Pics/logo2.webp"
      fetchpriority="high"
    />
    <!-- Open Graph / Twitter -->
    <meta property="og:title" content="Association Osaer" />
    <meta
      property="og:description"
      content="Danse contemporaine, chorégraphie. Découvrez nos projets et événements."
    />
    <meta property="og:image" content="/Pics/logo2.webp" />
    <meta property="og:url" content="https://associationosaer.com" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Content Security Policy -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://kit.fontawesome.com https://unpkg.com https://vercel.live;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://ka-f.fontawesome.com;
      img-src 'self' data: https://associationosaer.com https://unpkg.com;
      font-src 'self' https://fonts.gstatic.com;
      connect-src 'self' https://ka-f.fontawesome.com https://api.emailjs.com;
    "
    />
  </head>
  <body>
    <!-- Racine React -->
    <div id="root"></div>

    <!-- Check police préchargée -->
    <div id="font-preload-check" aria-hidden="true"></div>

    <!-- Script principal React -->
    <script type="module" src="/src/main.jsx" defer></script>
  </body>
</html>
