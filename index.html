<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />
    <meta
      name="description"
      content="Association Osaer – compagnie de danse contemporaine et de chorégraphie. Découvrez nos spectacles, projets artistiques et événements."
    />
    <meta
      name="google-site-verification"
      content="2pINTbw9nr-6K-L0L_iAXu4RwHO6FAp5U8o7VjQ7Sh8"
    />
    <title>Association Osaer | Danse contemporaine et chorégraphie</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/Pics/logo2.png" />
    <link rel="apple-touch-icon" href="/Pics/logo2.png" />

    <!-- Préchargement image LCP -->
    <link
      rel="preload"
      as="image"
      href="/Pics/logo2.webp"
      fetchpriority="high"
    />

    <link
      rel="preload"
      href="/fonts/Quicksand-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/Caveat-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Open Graph / Twitter -->
    <meta property="og:title" content="Association Osaer" />
    <meta
      property="og:description"
      content="Danse contemporaine, chorégraphie. Découvrez nos projets et événements."
    />
    <meta
      property="og:image"
      content="https://www.cieosaer.com/Pics/logo2.webp"
    />
    <meta property="og:url" content="https://www.cieosaer.com" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Content Security Policy -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' https://kit.fontawesome.com https://unpkg.com https://vercel.live;
    style-src 'self' 'unsafe-inline' https://ka-f.fontawesome.com;
img-src 'self' data: https://www.cieosaer.com https://unpkg.com;
    font-src 'self';
    connect-src 'self' https://ka-f.fontawesome.com https://api.emailjs.com;
  "
    />
  </head>
  <body>
    <!-- Racine React -->
    <div id="root"></div>

    <!-- Script principal React -->
    <script type="module" src="/src/main.jsx" defer></script>
  </body>
</html>
